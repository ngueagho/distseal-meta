model: unet_small2_yuv_quant

hidden:
  num_blocks: 4
  num_bits: 16
  in_channels: 3
  out_channels: 3
  z_channels: 64
  normalization: 'group'
  activation: 'gelu'
  last_tanh: True

hidden_orig:
  num_blocks: 4
  num_bits: 16
  in_channels: 3
  out_channels: 3
  z_channels: 64
  normalization: 'batch'
  activation: 'relu'
  last_tanh: False

unet_small2_quant: # quantization friendly unet2
