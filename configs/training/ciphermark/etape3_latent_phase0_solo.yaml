# ============================================================================
# ETAPE 3a, PHASE 0, v3 -- L'EMBALLEMENT D'ACTIVATIONS, ENFIN LA VRAIE CAUSE
#
# TROIS ECHECS, TROIS FAUSSES PISTES
# ----------------------------------
# Les runs a lot 8, lot 16 + sw 2.0, et lot 16 + sw 0.5 + lambda_i 0.1
# s'effondrent TOUS entre les epoques 17 et 21 -- soit ~3800 iterations --
# quels que soient le lot, la force du tatouage et la contrainte de fidelite.
# Trois hyperparametres differents, meme echec au meme endroit : ce n'etait
# donc aucun d'eux.
#
# LA PREUVE, LUE DANS LES CHECKPOINTS EFFONDRES
# ---------------------------------------------
# Les poids de convolution sont sains (mediane 0,029). Mais les running_var
# des BatchNorm de la pile bottleneck racontent une explosion d'ACTIVATIONS
# en cascade, multipliee par ~8 a chaque etage :
#
#     couche  1 :        7,0e3          couche  5 :   2,2e7
#     couche  3 :        4,3e5          couche  7 :   2,2e9
#
# Une fois les activations gigantesques, chaque non-linearite sature et la
# sortie de l'embedder devient CONSTANTE -- independante du message ET du
# latent. L'extracteur n'a plus rien a lire : ln 2 exactement, bit_acc 0,500.
# Et une perturbation constante bornee est petite apres decodage, d'ou le
# PSNR qui REMONTE pendant l'effondrement -- ce qui m'avait fait accuser a
# tort le tatouage de s'annuler par excès de contrainte de fidelite.
#
# POURQUOI RIEN NE L'ARRETE, ET POURQUOI PAS CHEZ DISTSEAL
# --------------------------------------------------------
# total_gnorm=1.0 n'ecrete PAS les gradients : c'est la constante de la
# ponderation adaptative des pertes, active uniquement si balanced=true --
# et balanced est false. Aucun ecretage n'existe dans ce chemin de code.
#
# La difference avec DistSeal est la RAMPE : son warmup fait 20 epoques de
# 1000 iterations, soit 20 000 pas de montee en LR ; le notre en faisait
# 1000. Il atteint 5e-4 vingt fois plus doucement -- l'emballement, qui se
# compose pas a pas, n'a jamais le temps de s'amorcer chez lui.
#
# CE QUI CHANGE (deux nombres, zero code)
# ---------------------------------------
#   warmup_t : 5 -> 20 epoques (4000 pas de rampe)
#   lr       : 5e-4 -> 1e-4
#
# Et l'on REVIENT au depart exact de DistSeal pour le reste : scaling_w 2.0,
# lambda_i 0.0. Le run 2, qui avait ces reglages, portait la meilleure
# trajectoire des trois (0,6579 a l'epoque 13) avant l'emballement.
#
# CE QU'IL FAUT SURVEILLER
# ------------------------
# L'effondrement, s'il revient, arrivera plus tard (LR plus bas, croissance
# plus lente) : surveiller au-dela de l'epoque 40. Signature : perte qui
# remonte vers 0,6931 PENDANT que le PSNR remonte. Si cela se reproduit
# malgre la rampe douce, la correction suivante est un vrai ecretage de
# gradient dans train.py -- un changement de code, assume et documente.
# ============================================================================

output_dir: /workspace/runs/etape3_latent_p0_v3

dataset:
    train_dir: /workspace/corpus-train512/train/toutes
    val_dir: /workspace/corpus-train512/val/toutes
    train_annotation_file: null
    val_annotation_file: null

img_size_proc: 256
img_size_val: 256
img_size: 256
embedder_model: unet_bottleneck
autoencoder: MaskgitVqgan
latent_layer: input_after_quantize
scaling_w: 2.0
scaling_w_schedule: Constant,scaling_min=2.0,epochs=200
seed: 0
batch_size_eval: 8
batch_size: 16
extractor_model: convnext_tiny
nbits: 64
hidden_size_multiplier: 1
attenuation: null
ae_quantize: true
scaling_i: 1.0
videowam_step_size: 8
num_augs: 1
augmentation_config: configs/augmentation/identity_only.yaml
balanced: false
total_gnorm: 1.0
lambda_dec: 1.0
lambda_det: 0.0
lambda_d: 0.0
lambda_i: 0.0
perceptual_loss: mse
maskbit_disc: true
maskbit_maxpool: 8
disc_num_layers: 3
disc_in_channels: 3
disc_start: 999999
epochs: 200
iter_per_epoch: 200
eval_freq: 10
saveimg_freq: 50
iter_per_valid: 10
scheduler: CosineLRScheduler,lr_min=1e-6,t_initial=200,warmup_lr_init=1e-8,warmup_t=20
optimizer: AdamW,lr=1e-4
full_eval_freq: 50
finetune_detector_start: 2000
workers: 6
