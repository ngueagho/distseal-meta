# ============================================================================
# ETAPE 3a, PHASE 0, EN SOLO -- LE LOT DE DISTSEAL, SANS PARTAGE DU GPU
#
# CE QUE LE RUN PARTAGE A MONTRE
# ------------------------------
# Lance en parallele de la phase F, donc a un lot de 8 au lieu des 16 de
# DistSeal, le curriculum a bien sorti le modele du point stationnaire -- puis
# l'y a laisse retomber :
#
#     epoque      17     18     19     20     21     22     23
#     loss_decode 0,6740 0,6746 0,6738 0,6734 0,6848 0,6938 0,6930
#
# ln 2 = 0,693147. L'echappee n'avait creuse que 0,02 en vingt epoques, et le
# PSNR a suivi la rechute : 17,26 puis 15,08. La reprise apres eviction n'y est
# pour rien -- elle s'etait faite proprement a l'epoque 18, « All keys matched »,
# optimiseur et ordonnanceurs compris, et l'effondrement est survenu trois
# epoques APRES.
#
# LE DIAGNOSTIC
# -------------
# Un lot deux fois plus petit double le bruit de gradient, et une echappee de
# point stationnaire est precisement ce qui y resiste le moins : le modele
# n'etait pas assez loin du bassin pour ne pas y etre renvoye.
#
# Faire tourner les deux entrainements en parallele ne ralentissait donc pas
# seulement l'etape 3a : cela l'EMPECHAIT de converger.
#
# CE QUI CHANGE ICI, ET RIEN D'AUTRE
# ----------------------------------
# batch_size 8 -> 16, la valeur de DistSeal, et batch_size_eval 4 -> 8. Le run
# a le GPU pour lui seul. Le curriculum de la phase 0 est conserve tel quel --
# identity_only, lambda_d 0.0, disc_start repousse -- puisque c'est lui qui
# avait produit l'echappee.
#
# On repart de zero : le checkpoint du run partage est retombe au point trivial
# et ne vaut rien comme point de depart. Il est archive sous
# runs/etape3_latent_phase0_effondre_lot8, comme piece du diagnostic.
#
# Lancement, une fois la phase F terminee :
#   PYTHONPATH=deps:. torchrun --nproc_per_node=1 --standalone train.py \
#       --config configs/training/ciphermark/etape3_latent_phase0_solo.yaml
# ============================================================================

output_dir: /workspace/runs/etape3_latent_phase0_solo

dataset:
    train_dir: /workspace/corpus-train512/train/toutes
    val_dir: /workspace/corpus-train512/val/toutes
    train_annotation_file: null
    val_annotation_file: null

img_size_proc: 256
img_size_val: 256
img_size: 256
embedder_model: unet_bottleneck
autoencoder: MaskgitVqgan
latent_layer: input_after_quantize
scaling_w: 2.0
scaling_w_schedule: Constant,scaling_min=2.0,epochs=200
seed: 0
batch_size_eval: 8
batch_size: 16
extractor_model: convnext_tiny
nbits: 64
hidden_size_multiplier: 1
attenuation: null
ae_quantize: true
scaling_i: 1.0
videowam_step_size: 8
num_augs: 1
augmentation_config: configs/augmentation/identity_only.yaml
balanced: false
total_gnorm: 1.0
lambda_dec: 1.0
lambda_det: 0.0
lambda_d: 0.0
lambda_i: 0.0
perceptual_loss: mse
maskbit_disc: true
maskbit_maxpool: 8
disc_num_layers: 3
disc_in_channels: 3
disc_start: 999999
epochs: 200
iter_per_epoch: 200
eval_freq: 10
saveimg_freq: 50
iter_per_valid: 10
scheduler: CosineLRScheduler,lr_min=1e-6,t_initial=200,warmup_lr_init=1e-8,warmup_t=5
optimizer: AdamW,lr=5e-4
full_eval_freq: 50
finetune_detector_start: 2000
workers: 6
