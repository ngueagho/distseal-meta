#========================================================================================
# CONFIG 3 -- "phase 0", intervention la plus radicale apres l'echec de la
# phase 1 (curriculum avec lambda_i=0.1 seul).
#
# Constat (16 aout 2026) : meme SANS discriminateur (lambda_d=0), psnr grimpe
# sans fin (44 -> 73 dB en 67 epoques, ssim->1.0000) pendant que bit_acc reste
# exactement au hasard. Diagnostic : un discriminateur ne peut structurellement
# PAS empecher un filigrane de devenir invisible (une image identique a
# l'originale est par definition indiscernable pour lui) -- donc rien dans la
# config precedente ne forcait une amplitude de signal minimale. La seule
# perte qui pourrait le faire (lambda_dec, decodage) n'avait aucune chance de
# creer ce contre-signal tant que lambda_i>0 recompense activement le
# retrecissement du signal.
#
# Phase 0 : lambda_i=0.0 ET lambda_d=0.0 -- SEUL lambda_dec pilote l'embedder.
# Aucune pression ne pousse vers l'invisibilite. But : verifier si le canal
# de decodage peut au moins s'etablir seul sur le vrai dataset diversifie
# (contrairement a lambda_i=0.1 qui a echoue deux fois). Repart de zero
# (nouveau output_dir) -- les poids du run precedent ont deja appris a
# minimiser l'amplitude, mauvais point de depart pour tester cette hypothese.
#
# Si bit_acc decolle ici : reintroduire lambda_i/lambda_d progressivement
# (phase suivante, reprise de checkpoint) une fois un signal etabli. Si meme
# ca ne marche pas : le probleme n'est plus une question de ponderation des
# pertes, mais de volume de pas/donnees insuffisant pour nbits=256 -- a
# documenter comme tel.
#========================================================================================
output_dir: "/workspace/runs/runpod_256bits_phase0_puredecode"

dataset:
    train_dir: ./corpus-colab/train
    val_dir: ./corpus-colab/val
    train_annotation_file: null
    val_annotation_file: null

#========================================================================================
img_size_proc: 256
img_size_val: 256
img_size: 256

embedder_model: unet_small2_yuv_quant
extractor_model: convnext_tiny
nbits: 256
hidden_size_multiplier: 1
scaling_w: 0.5
scaling_w_schedule: Cosine,scaling_min=0.1,start_epoch=150,epochs=900

#========================================================================================
seed: 0

batch_size_eval: 8
batch_size: 16
workers: 4

attenuation: null
scaling_i: 1.0
ae_quantize: true
videowam_step_size: 8

num_augs: 1
augmentation_config: configs/augmentation/identity_only.yaml

balanced: false
total_gnorm: 1.0
lambda_dec: 1.0
lambda_det: 0.0
# PHASE 0 : AUCUNE pression de fidelite ni adversariale -- seul le decodage
# pilote l'embedder, pour verifier si le canal peut s'etablir seul.
lambda_d: 0.0
lambda_i: 0.0
perceptual_loss: mse
maskbit_disc: true
maskbit_maxpool: 8
disc_num_layers: 3
disc_in_channels: 3
disc_start: 999999

epochs: 900
iter_per_epoch: 200
eval_freq: 20
saveimg_freq: 20
iter_per_valid: 4
scheduler: CosineLRScheduler,lr_min=1e-6,t_initial=900,warmup_lr_init=1e-8,warmup_t=5
optimizer: AdamW,lr=5e-4
full_eval_freq: 100
finetune_detector_start: 2000
saveckpt_freq: 10
