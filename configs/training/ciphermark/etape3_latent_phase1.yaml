# ============================================================================
# ETAPE 3a, PHASE 1 -- LA RECETTE COMPLETE DE DISTSEAL, UNE FOIS AMORCE
#
# ENCHAINEMENT
# ------------
# La phase 0 retire la difficulte du depart pour sortir du point stationnaire
# trivial. Elle ne produit pas le modele voulu : un embedder entraine sans
# aucune augmentation ne resiste a rien. Cette phase 1 restaure ce que la
# phase 0 avait mis de cote, en repartant de ses poids :
#
#   augmentation_config : identity_only  ->  all_augs_v3   (celui de DistSeal)
#   num_augs            : 1              ->  2
#   lambda_d            : 0.0            ->  0.1
#   disc_start          : 999999         ->  20
#
# Tout le reste est inchange depuis l'etape 3a : unet_bottleneck, MaskgitVqgan,
# input_after_quantize, scaling_w 2.0, nbits 64, lambda_i 0.0, lot 16.
#
# disc_start passe a 20 et non a 200 : les 200 epoques de DistSeal comptaient
# depuis un modele neuf, or celui-ci arrive deja amorce. Vingt epoques de
# reprise en main avant d'ajouter la pression adversariale suffisent.
#
# CE QU'IL FAUT SURVEILLER
# ------------------------
# La bit_acc VA baisser en debut de phase 1 : les augmentations rendent la
# tache plus dure, c'est attendu et ce n'est pas une regression. Le signal
# d'alarme serait que loss_decode remonte a 0,6931 et y reste -- retour au
# point stationnaire, cette fois par exces de difficulte, ce qui voudrait dire
# qu'il faut introduire les augmentations progressivement plutot que d'un coup.
#
# Lancement :
#   PYTHONPATH=deps:. torchrun --nproc_per_node=1 --standalone train.py \
#       --config configs/training/ciphermark/etape3_latent_phase1.yaml
# ============================================================================

output_dir: /workspace/runs/etape3_latent_phase1
resume_from: /workspace/runs/etape3_latent_phase0_solo/checkpoint.pth
resume_optimizer_state: false

dataset:
    train_dir: /workspace/corpus-train512/train/toutes
    val_dir: /workspace/corpus-train512/val/toutes
    train_annotation_file: null
    val_annotation_file: null

img_size_proc: 256
img_size_val: 256
img_size: 256
embedder_model: unet_bottleneck
autoencoder: MaskgitVqgan
latent_layer: input_after_quantize
scaling_w: 2.0
scaling_w_schedule: Cosine,scaling_min=0.5,start_epoch=100,epochs=100
seed: 0
batch_size_eval: 8
batch_size: 16
extractor_model: convnext_tiny
nbits: 64
hidden_size_multiplier: 1
attenuation: null
ae_quantize: true
scaling_i: 1.0
videowam_step_size: 8
num_augs: 2
augmentation_config: configs/augmentation/all_augs_v3.yaml
balanced: false
total_gnorm: 1.0
lambda_dec: 1.0
lambda_det: 0.0
lambda_d: 0.1
lambda_i: 0.0
perceptual_loss: mse
maskbit_disc: true
maskbit_maxpool: 8
disc_num_layers: 3
disc_in_channels: 3
disc_start: 20
epochs: 400
iter_per_epoch: 200
eval_freq: 10
saveimg_freq: 50
iter_per_valid: 10
scheduler: CosineLRScheduler,lr_min=1e-6,t_initial=400,warmup_lr_init=1e-8,warmup_t=10
optimizer: AdamW,lr=2e-4
full_eval_freq: 50
finetune_detector_start: 2000
workers: 8
