#========================================================================================
# CONFIG -- "phase 2", nbits=64, 100% LOCAL CPU : reintroduction PRUDENTE de la
# fidelite apres la phase 0 (decodage pur), meme logique que
# posthoc_pixel_256bits_runpod_phase2_reintroduce_fidelity.yaml mais a nbits=64.
#
# Reprend du checkpoint de posthoc_pixel_64bits_local_phase0.yaml (MEME
# output_dir -> train.py reprend automatiquement de output_dir/checkpoint.pth,
# cf. train.py:437-450). lambda_i remonte a 0.01 (10x moins que 0.1, le
# palier qui avait fait collapser bit_acc a 256 bits), lambda_d et
# l'augmentation restent inchanges (un seul axe de difficulte reintroduit a
# la fois).
#
# But : verifier si, a nbits=64 aussi, un signal de decodage deja etabli
# (phase 0) resiste a une reintroduction douce de la pression de fidelite, ou
# si bit_acc retombe au hasard (0.5) comme les tentatives a lambda_i=0.1
# d'emblee.
#
# epochs=600 : phase 0 plafonne a 300 (son propre epochs). Reprendre avec
# epochs<=300 rendrait range(start_epoch=300, epochs) vide -- boucle
# d'entrainement ne ferait rien du tout (bug deja rencontre sur RunPod, cf.
# l'en-tete de posthoc_pixel_256bits_runpod_phase2_reintroduce_fidelity.yaml).
# Plafond releve nettement au-dessus (600, soit 300 epoques supplementaires
# reelles) pour laisser la place a une observation significative.
#
# Usage:
#   torchrun --nproc_per_node=1 --standalone train.py \
#       --config configs/training/ciphermark/posthoc_pixel_64bits_local_phase2.yaml
#========================================================================================
output_dir: "./runs/local_64bits_phase0"

dataset:
    train_dir: ./corpus-smoketest/train
    val_dir: ./corpus-smoketest/val
    train_annotation_file: null
    val_annotation_file: null

#========================================================================================
img_size_proc: 64
img_size_val: 64
img_size: 64

embedder_model: unet_small2_yuv_quant
extractor_model: convnext_tiny
nbits: 64
hidden_size_multiplier: 1
scaling_w: 0.5
scaling_w_schedule: Cosine,scaling_min=0.1,start_epoch=50,epochs=300

#========================================================================================
seed: 0

batch_size_eval: 2
batch_size: 2
workers: 0

attenuation: null
scaling_i: 1.0
ae_quantize: true
videowam_step_size: 8

num_augs: 1
augmentation_config: configs/augmentation/identity_only.yaml

balanced: false
total_gnorm: 1.0
lambda_dec: 1.0
lambda_det: 0.0
# PHASE 2 : disc toujours desactive -- un seul axe de difficulte a la fois.
lambda_d: 0.0
# PHASE 2 : fidelite reintroduite a 10x moins que ce qui a fait collapser les
# tentatives a lambda_i=0.1 (meme prudence que la phase 2 a 256 bits).
lambda_i: 0.01
perceptual_loss: mse
maskbit_disc: true
maskbit_maxpool: 8
disc_num_layers: 3
disc_in_channels: 3
disc_start: 999999

epochs: 600  # phase 0 plafonne a 300 (son propre epochs) -- doit rester STRICTEMENT
             # au-dessus pour que range(start_epoch=300, epochs) ne soit pas vide.
iter_per_epoch: 8
eval_freq: 20
saveimg_freq: 20
iter_per_valid: 2
# scheduler NON modifie (t_initial reste 300, comme la phase 2 a 256 bits) :
# timm CosineLRScheduler maintient lr_min une fois epoch >= t_initial, ce qui
# est voulu ici (LR basse et stable pour cette transition delicate).
scheduler: CosineLRScheduler,lr_min=1e-6,t_initial=300,warmup_lr_init=1e-8,warmup_t=5
optimizer: AdamW,lr=5e-4
full_eval_freq: 100
finetune_detector_start: 2000
saveckpt_freq: 1000  # cf. incident disque plein RunPod -- pas de snapshots numerotes accumules
