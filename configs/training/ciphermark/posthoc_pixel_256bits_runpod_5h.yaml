#========================================================================================
# CONFIG 3/4 -- run paye RunPod, budget de TEMPS (~5h), pas de nombre d'epoques fixe.
# Meme famille que la config 2 (Colab) : resolution 256, nbits=256, lambda_i=0.1
# (fix effondrement PSNR), mais GPU payant (A100) donc batch_size plus grand.
#
# epochs est volontairement tres au-dessus de ce qui sera reellement atteint en 5h :
# c'est le script run_5h.sh (timeout 5h) qui arrete le run, pas cette config. Le
# dernier checkpoint sauvegarde avant l'arret est celui a recuperer.
#
# CONFIG 4 (echelle DistSeal complete, ~500h-GPU) reste a definir separement --
# cf. discussion cout (55-75k EUR a l'achat, ~700-1000$ en location) si le budget
# le permet un jour.
#========================================================================================
output_dir: "/workspace/runs/runpod_256bits_5h"

dataset:
    train_dir: ./corpus-colab/train
    val_dir: ./corpus-colab/val
    train_annotation_file: null
    val_annotation_file: null

#========================================================================================
img_size_proc: 256
img_size_val: 256
img_size: 256

embedder_model: unet_small2_yuv_quant
extractor_model: convnext_tiny
nbits: 256
hidden_size_multiplier: 1
# scaling_w remonte 0.2->0.5 : sur calibration (15-70 epoques, ~1400 pas), bit_acc
# restait EXACTEMENT a 0.50 pendant que psnr grimpait sans fin (27->45) et
# loss_percep tombait a 0.0000 -- solution degeneree ou l'embedder n'ecrit
# quasiment plus rien. Hypothese : 0.2 est le budget de perturbation calibre par
# DistSeal pour 64 bits (cf. configs/training/*/posthoc_pixel.yaml) ; a nbits=256
# (4x l'info a coder) dans le meme budget, combine a lambda_i=0.1 qui recompense
# desormais explicitement la fidelite, l'optimiseur "abandonne" le canal message
# au profit du seul canal fidelite (qu'il peut driver a 0 facilement). A
# revalider par une calibration courte avant de relancer un run long.
scaling_w: 0.5
scaling_w_schedule: Cosine,scaling_min=0.1,start_epoch=50,epochs=300

#========================================================================================
seed: 0

# GPU paye (A100 40/80 Go) : plus de VRAM que le T4 Colab -> batch plus grand,
# donc plus d'iterations utiles dans les 5h payees. Reduire a 16 si OOM persiste.
batch_size_eval: 16
batch_size: 32
workers: 4

attenuation: null
scaling_i: 1.0
ae_quantize: true
videowam_step_size: 8

num_augs: 2
augmentation_config: configs/augmentation/all_augs_v3.yaml

balanced: false
total_gnorm: 1.0
lambda_dec: 1.0
lambda_det: 0.0
lambda_d: 0.1
lambda_i: 0.1              # cf. config 2 : corrige l'effondrement PSNR/SSIM observe
perceptual_loss: mse
maskbit_disc: true
maskbit_maxpool: 8
disc_num_layers: 3
disc_in_channels: 3
disc_start: 20

# training : plafond volontairement haut, c'est le budget TEMPS (run_5h.sh) qui
# arrete reellement le run, pas ce nombre d'epoques.
epochs: 300
iter_per_epoch: 200
eval_freq: 20               # eval moins frequente qu'en config 2 : chaque eval
saveimg_freq: 20            # complete coute du temps paye, on la limite
iter_per_valid: 4
scheduler: CosineLRScheduler,lr_min=1e-6,t_initial=300,warmup_lr_init=1e-8,warmup_t=5
optimizer: AdamW,lr=5e-4
full_eval_freq: 100
finetune_detector_start: 2000
saveckpt_freq: 10           # snapshots numerotes frequents : filet de securite si
                             # l'arret timeout tombe pendant l'ecriture de checkpoint.pth
