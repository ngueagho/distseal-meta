# ============================================================================
# ETAPE 3b, PHASE 1 -- LA FIDELITE, SUR LA VOIE DIFFUSION
#
# Meme logique que etape3_latent_phase1 (la voie autoregressive) : la phase 0
# amorce sans augmentation ni discriminateur, cette phase 1 restaure la recette
# de DistSeal -- all_augs_v3, lambda_d 0.1, discriminateur a l'epoque 20 -- en
# repartant des poids amorces.
#
# Les parametres propres a la voie diffusion viennent de
# configs/training/diffusion/posthoc_latent.yaml, la config de DistSeal :
# unet_bottleneck128 sur DC-AE f64c128, 512 px, scaling_w 1.5 (redescendant a
# 0.4 par cosinus a partir de l'epoque 100, comme sa recette le fait de 2.0
# vers 0.5 sur l'autre voie). Lot de 8 : a 512 px, 16 ne tient pas sur 24 Go.
#
# La rampe douce (warmup 10, lr 2e-4 en reprise) reste imperative : c'est
# l'absence de rampe qui a fait exploser les activations trois fois sur la
# voie autoregressive, et aucun ecretage de gradient n'existe dans ce chemin.
#
# Lancement (par le superviseur, apres la phase 0 de 3b) :
#   PYTHONPATH=deps:. torchrun --nproc_per_node=1 --standalone train.py \
#       --config configs/training/ciphermark/etape3b_latent_phase1.yaml
# ============================================================================

output_dir: /workspace/runs/etape3b_latent_p1
resume_from: /workspace/runs/etape3b_latent_diffusion_phase0/checkpoint.pth
resume_optimizer_state: false

dataset:
    train_dir: /workspace/corpus-train512/train/toutes
    val_dir: /workspace/corpus-train512/val/toutes
    train_annotation_file: null
    val_annotation_file: null

img_size_proc: 512
img_size_val: 512
img_size: 512
embedder_model: unet_bottleneck128
autoencoder: DCAEf64c128
scaling_w: 1.5
scaling_w_schedule: Cosine,scaling_min=0.4,start_epoch=100,epochs=100
seed: 0
batch_size_eval: 2
batch_size: 8
extractor_model: convnext_tiny
nbits: 64
hidden_size_multiplier: 1
attenuation: null
scaling_i: 1.0
videowam_step_size: 8
num_augs: 2
augmentation_config: configs/augmentation/all_augs_v3.yaml
balanced: false
total_gnorm: 1.0
lambda_dec: 1.0
lambda_det: 0.0
lambda_d: 0.1
lambda_i: 0.0
perceptual_loss: mse
maskbit_disc: true
maskbit_maxpool: 8
disc_num_layers: 3
disc_in_channels: 3
disc_start: 20
epochs: 400
iter_per_epoch: 200
eval_freq: 10
saveimg_freq: 50
iter_per_valid: 10
scheduler: CosineLRScheduler,lr_min=1e-6,t_initial=400,warmup_lr_init=1e-8,warmup_t=10
optimizer: AdamW,lr=2e-4
full_eval_freq: 50
finetune_detector_start: 2000
workers: 8
