# Phase F -- conditionnement du decodeur MaskGIT-VQGAN sur Omega.
#
# Ce qu'elle comble
# -----------------
# Le titre et la question de recherche annoncent une compatibilite
# architecturale large. La partie experimentale ne montrait jusqu'ici qu'un
# seul decodeur, celui d'un autoencodeur a diffusion (DC-AE). C'est le trou le
# plus visible du memoire pour un jury.
#
# MaskGIT-VQGAN est le tokeniseur des modeles AUTOREGRESSIFS : quantification
# vectorielle, dictionnaire de 1024 entrees, latent a 256 canaux -- une famille
# entierement differente du DC-AE continu. Si le meme conditionneur FiLM y
# fonctionne sans rien changer d'autre que le modele, l'agnosticisme
# architectural cesse d'etre une affirmation.
#
# Ce qu'elle ne fera PAS, et il faut le dire
# ------------------------------------------
# MaskGIT-VQGAN est un tokeniseur, pas un generateur pilote par texte. Cette
# phase ne donnera donc pas de chaine "prompt -> image" sur la voie
# autoregressive : elle demontre que le decodeur porte Omega, rien de plus.
# Une chaine texte vers image autoregressive exigerait un modele autoregressif
# conditionne par texte, absent du depot.
#
# Discipline : UN seul facteur change par rapport a la phase D -- le modele.
# Bornes, learning rates, poids de pertes, watermarker enseignant, taille de
# lot : identiques. Les etages du decodeur sont decouverts par passe a blanc,
# jamais codes en dur -- sur le DC-AE la config annonçait 7 largeurs et
# l'observation en a trouve 6, dans l'ordre inverse.
#
# Lancement :
#   PYTHONPATH=deps:. python3 distill.py \
#       config=configs/training/ciphermark/phaseF_maskgit.yaml

run_dir: /workspace/runs/phaseF_maskgit

imagenet:
    data_dir: /workspace/corpus-eval-12k
    # 16 tenait a l'entrainement mais debordait pendant la validation, qui
    # fait tourner en plus le reseau de reference, le watermarker enseignant
    # et LPIPS. 12 reste trois fois le reglage d'origine.
    batch_size: 12
    # 255 coeurs disponibles, et le defaut de 8 ouvriers laissait le GPU a
    # 0-33 % d'utilisation : l'entrainement etait bride par le chargement des
    # images, pas par le calcul.
    n_worker: 32

model: maskgit-vqgan

# --- conditionnement (identique a la phase D) -------------------------------
omega_nbits: 64
freeze_decoder: false
omega_gamma_max: 0.3
omega_beta_max: 0.1

# --- watermarker enseignant (identique) -------------------------------------
latent_watermarker: false
watermarker_ckpt_path: /workspace/ckpt/base_64bits.pth
watermarker_scaling_w: 0.1152

# --- pertes (identiques) ----------------------------------------------------
extractor_weight: 0.5
perceptual_weight: 1.0
pixel_weight: 1.0
reconstruction_weight_wm: 1.0
reconstruction_weight_ori: 0.0

resolution: 256
train_dataset: imagenet

max_steps: 40000
num_batches: 10
# La validation coute cher et laisse le GPU en attente : tous les 2000 pas
# plutot que tous les 500 divise cette surcharge par quatre.
evaluate_steps: 2000
save_checkpoint_steps: 2000
use_eval_mode_in_train: false
clip_grad: 1
compute_fid: false
log: true
amp: bf16

lr_scheduler:
    name: constant_with_warmup
    warmup_steps: 300
optimizer:
    betas: [0.9, 0.999]
    lr: 0.00004
    name: adamw
omega_lr: 0.0004
